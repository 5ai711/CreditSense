name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests plus the Testcontainers integration test (Docker is available on the runner)
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  stack:
    # Builds every image and checks the running system through the web app's proxy.
    needs: [ml-service, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          for i in $(seq 1 60); do
            if docker compose logs backend | grep -q "demo seed complete"; then break; fi
            sleep 5
          done
          token=$(curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"officer@creditsense.demo","password":"Demo@1234"}' | jq -r .accessToken)
          count=$(curl -fsS "http://localhost:3000/api/applications?size=100" \
            -H "Authorization: Bearer $token" | jq '.content | length')
          echo "applications visible to the officer: $count"
          test "$count" -gt 40
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
