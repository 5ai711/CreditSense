# One command brings up the whole system:  docker compose up --build
# Frontend: http://localhost:3000   API + Swagger: http://localhost:8080/swagger-ui.html
# For a server deployment add the production overrides: see docker-compose.prod.yml.
name: creditsense

# Rotate container logs so a long-running deployment cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: creditsense
      POSTGRES_USER: creditsense
      POSTGRES_PASSWORD: ${DB_PASSWORD:-creditsense}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditsense -d creditsense"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    logging: *logging
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token}
      ML_RETRAIN_TRIALS: ${ML_RETRAIN_TRIALS:-0}
    volumes:
      - mldata:/data
    # not published: only the backend may call the model

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/creditsense
      DB_USER: creditsense
      DB_PASSWORD: ${DB_PASSWORD:-creditsense}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-in-production}
      ML_BASE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 20

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
  mldata:
